<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="header"></header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>

      <div class="checkout-wrapper">

        <form name="checkout" class="checkout-form" action="#" method="post">
          <h3>Checkout Information</h3>

          <!-- Customer Name -->
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required>

          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required>

          <!-- Address -->
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required>

          <label for="city">City</label>
          <input type="text" id="city" name="city" required>

          <label for="state">State</label>
          <input type="text" id="state" name="state" required>

          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" required pattern="[0-9]{5}">

          <!-- Payment -->
          <label for="cardNumber">Credit Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" required pattern="[0-9]{16}">

          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" placeholder="MM/YY" required
            pattern="[0-9]{1,2}/[0-9]{2}">

          <label for="code">Security Code</label>
          <input type="text" id="code" name="code" required pattern="[0-9]{3}">

          <!-- Button -->
          <button type="submit" class="checkout-button" id="checkoutSubmit">Checkout</button>
        </form>


        <div class="checkout-summary">
          <h3>Order Summary</h3>
          <p>Subtotal: <em>$<span id="subtotal">0.00</span></em></p>
          <p>Tax: <em>$<span id="tax">0.00</span></em></p>
          <p>Shipping Estimate: <em>$<span id="shipping">0.00</span></em></p>
          <p>Total: $<strong><span id="total">0.00</span></strong></p>
        </div>

      </div>

    </section>
  </main>

  <footer id="footer"></footer>
</body>

</html>
